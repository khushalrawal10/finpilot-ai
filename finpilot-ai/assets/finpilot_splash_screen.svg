    <stop offset="100%" stop-color="#1490FE"/>
  </linearGradient>
  <linearGradient id="glow" x1="0.5" y1="0" x2="0.5" y2="1">
    <stop offset="0%" stop-color="#1490FE" stop-opacity="0.15"/>
    <stop offset="100%" stop-color="#1490FE" stop-opacity="0"/>
  </linearGradient>
</defs>

<rect x="0" y="0" width="680" height="1200" fill="url(#splashBg)" style="stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

<ellipse cx="340" cy="480" rx="260" ry="260" fill="url(#glow)" style="stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

