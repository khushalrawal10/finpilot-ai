<text x="340" y="610" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="56" fill="#FFFFFF" text-anchor="middle" letter-spacing="-1" style="fill:rgb(255, 255, 255);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:system-ui, -apple-system, sans-serif;font-size:56px;font-weight:800;text-anchor:middle;dominant-baseline:auto">FinPilot</text>
