<svg width="100%" viewBox="0 0 690 1210" role="img" xmlns="http://www.w3.org/2000/svg" style="">
<title style="fill:rgb(0, 0, 0);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">FinPilot Splash Screen</title>
<desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">App splash screen — deep navy background, centered logo mark and wordmark, tagline below</desc>
<defs>
  <linearGradient id="splashBg" x1="0" y1="0" x2="0.3" y2="1">
    <stop offset="0%" stop-color="#0D2B4E"/>
    <stop offset="100%" stop-color="#061D42"/>
  </linearGradient>
  <linearGradient id="splashHex" x1="0" y1="0" x2="0.5" y2="1">
